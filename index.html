    <script>
      (function() {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var activeFetch = origFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch || origFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return activeFetch || origFetch;
                },
                set: function(fn) {
                  activeFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }
        } catch (err) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
